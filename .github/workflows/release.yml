name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.305

      - name: Pin .NET 9 workload set
        shell: pwsh
        run: Copy-Item .github/dotnet9-global.json global.json

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Velopack release
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-windows-velopack.ps1 `
            -Version $env:RELEASE_VERSION `
            -RepositoryUrl 'https://github.com/${{ github.repository }}'

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows/*/releases/*
          if-no-files-found: error

  macos:
    name: macOS universal DMG
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.305

      - name: Pin .NET 9 workload set
        run: cp .github/dotnet9-global.json global.json

      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst

      - name: Read version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build unsigned DMG
        run: |
          VERSION="$RELEASE_VERSION" \
          BUILD_NUMBER="${{ github.run_number }}" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          bash ./scripts/build-macos-dmg.sh

      - name: Add stable DMG name
        run: |
          dmg="artifacts/macos/$RELEASE_VERSION/ChurchTimeTracker-$RELEASE_VERSION-mac.dmg"
          cp "$dmg" "artifacts/macos/$RELEASE_VERSION/ChurchTimeTracker-mac.dmg"

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            artifacts/macos/*/ChurchTimeTracker-*-mac.dmg
            artifacts/macos/*/ChurchTimeTracker-mac.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - macos
    runs-on: windows-latest
    steps:
      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download macOS files
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release/macos

      - name: Install Velopack CLI
        run: dotnet tool install --tool-path .tools vpk --version 1.2.161

      - name: Publish Windows release files
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assetsFile = Get-ChildItem release/windows -Recurse -File -Filter assets.win.json |
            Select-Object -First 1
          if (-not $assetsFile) {
            throw 'The Windows Velopack assets file was not found in the downloaded artifact.'
          }

          ./.tools/vpk upload github `
            --repoUrl 'https://github.com/${{ github.repository }}' `
            --outputDir $assetsFile.Directory.FullName `
            --tag '${{ github.ref_name }}' `
            --releaseName 'Church Time Tracker ${{ github.ref_name }}' `
            --publish

      - name: Add macOS files to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $macFiles = @(Get-ChildItem release/macos -Recurse -File)
          if ($macFiles.Count -eq 0) {
            throw 'No macOS release files were found in the downloaded artifact.'
          }

          & gh release upload '${{ github.ref_name }}' @($macFiles.FullName) `
            --repo '${{ github.repository }}' `
            --clobber
