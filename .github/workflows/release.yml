name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Velopack release
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-windows-velopack.ps1 `
            -Version $env:RELEASE_VERSION `
            -RepositoryUrl 'https://github.com/${{ github.repository }}'

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/windows/*/releases/*
          if-no-files-found: error

  macos:
    name: macOS DMG and Sparkle feed
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Mac Catalyst workload
        run: dotnet workload install maui-maccatalyst

      - name: Validate Sparkle keys
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" || -z "$SPARKLE_PRIVATE_ED_KEY_BASE64" ]]; then
            echo "Add SPARKLE_PUBLIC_ED_KEY and SPARKLE_PRIVATE_ED_KEY_BASE64 in repository Actions secrets." >&2
            exit 1
          fi

      - name: Read version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build unsigned DMG
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          VERSION="$RELEASE_VERSION" \
          BUILD_NUMBER="${{ github.run_number }}" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          ./scripts/build-macos-dmg.sh

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_ED_KEY_BASE64 }}
        run: |
          tools_root="$RUNNER_TEMP/sparkle-tools"
          update_root="$RUNNER_TEMP/sparkle-update"
          private_key="$RUNNER_TEMP/sparkle-private-key"
          mkdir -p "$tools_root" "$update_root"

          curl --fail --location --silent --show-error \
            'https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz' \
            --output "$RUNNER_TEMP/Sparkle-2.9.6.tar.xz"
          tar -xJf "$RUNNER_TEMP/Sparkle-2.9.6.tar.xz" -C "$tools_root"

          dmg="artifacts/macos/$RELEASE_VERSION/ChurchTimeTracker-$RELEASE_VERSION-mac.dmg"
          cp "$dmg" "$update_root/"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY_BASE64" | base64 -D > "$private_key"

          generate_appcast="$(find "$tools_root" -type f -path '*/bin/generate_appcast' -print -quit)"
          if [[ -z "$generate_appcast" ]]; then
            echo "Sparkle generate_appcast was not found." >&2
            exit 1
          fi

          "$generate_appcast" \
            --ed-key-file "$private_key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            "$update_root"

          rm -f "$private_key"
          cp "$update_root/appcast.xml" "artifacts/macos/$RELEASE_VERSION/appcast.xml"
          cp "$dmg" "artifacts/macos/$RELEASE_VERSION/ChurchTimeTracker-mac.dmg"

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            artifacts/macos/*/ChurchTimeTracker-*-mac.dmg
            artifacts/macos/*/ChurchTimeTracker-mac.dmg
            artifacts/macos/*/appcast.xml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - macos
    runs-on: windows-latest
    steps:
      - name: Download Windows files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download macOS files
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release/macos

      - name: Install Velopack CLI
        run: dotnet tool install --tool-path .tools vpk --version 1.2.161

      - name: Publish Windows release files
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.tools/vpk upload github `
            --repoUrl 'https://github.com/${{ github.repository }}' `
            --outputDir release/windows `
            --tag '${{ github.ref_name }}' `
            --releaseName 'Church Time Tracker ${{ github.ref_name }}' `
            --publish

      - name: Add macOS files to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload '${{ github.ref_name }}' release/macos/* --clobber
